name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    # Requires GitHub Environment secret NPM_TOKEN (npm automation token with publish scope).

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Build dashboard SPA for npm tarball
        run: sh scripts/build-dashboard-spa.sh

      - name: Run full test suite
        run: pnpm -r test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run corpus evaluation
        run: pnpm tsx corpus/run-eval.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish all @mcp-guardian packages (ordered + verified)
        run: ./scripts/publish-npm-all.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_PROVENANCE: "1"

      - name: Verify clean registry install of published server
        run: |
          SERVER_VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-npm-registry-install.mjs "$SERVER_VERSION"

      - name: Attest build provenance (root package)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/index.js
            dist/cli.js
