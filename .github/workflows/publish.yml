name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    # Requires GitHub Environment secret NPM_TOKEN (npm automation token with publish scope).

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Publish @mcp-guardian/plugin-sdk
        working-directory: packages/plugin-sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run full test suite
        run: pnpm -r test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run corpus evaluation
        run: pnpm tsx corpus/run-eval.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish @mcp-guardian/core
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm dependency visibility
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          PLUGIN_SDK_VERSION=$(node -p "require('./packages/plugin-sdk/package.json').version")
          node scripts/wait-npm-registry.mjs @mcp-guardian/plugin-sdk "$PLUGIN_SDK_VERSION"
          node scripts/wait-npm-registry.mjs @mcp-guardian/core "$CORE_VERSION"

      - name: Publish @mcp-guardian/server (root — full dep tree)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published server installs from registry
        run: |
          SERVER_VERSION=$(node -p "require('./package.json').version")
          node scripts/wait-npm-registry.mjs @mcp-guardian/server "$SERVER_VERSION"
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "@mcp-guardian/server@$SERVER_VERSION"

      - name: Publish @mcp-guardian/cli
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attest build provenance (root package)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/index.js
            dist/cli.js
